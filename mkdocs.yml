site_name: Segreteria AGESCI Hirpinia — Guida per i Capigruppo
site_description: >-
  Guida operativa per il ruolo CG (account email di gruppo) sulla piattaforma
  Segreteria AGESCI Hirpinia.
site_author: AGESCI Zona Hirpinia
docs_dir: docs-utente
site_dir: site

theme:
  name: material
  language: it
  palette:
    primary: deep purple
    accent: amber
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Introduzione: index.md
  - Capogruppo:
      - IBAN e intestazione conto: capogruppo/iban-gruppo.md
      - Partecipazione al contributo Fo.Ca.: capogruppo/partecipazioni-foca.md

plugins:
  - search
  - with-pdf:
      output_path: pdf/guida-capigruppo.pdf
      cover_title: Guida per i Capigruppo
      cover_subtitle: Segreteria AGESCI Hirpinia
      author: AGESCI Zona Hirpinia

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
