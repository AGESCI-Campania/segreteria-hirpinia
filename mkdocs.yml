site_name: Segreteria AGESCI Hirpinia — Guida per i Capigruppo
site_description: >-
  Guida operativa per il ruolo CG (account email di gruppo) sulla piattaforma
  Segreteria AGESCI Hirpinia.
site_author: AGESCI Zona Hirpinia
docs_dir: docs-utente
site_dir: site

theme:
  name: material
  language: it
  palette:
    primary: green
    accent: light green
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Introduzione: index.md
  - Capogruppo:
      - IBAN e intestazione conto: capogruppo/iban-gruppo.md
      - Partecipazione al contributo Fo.Ca.: capogruppo/partecipazioni-foca.md
      - Riepilogo dei gruppi: capogruppo/riepilogo-contributi.md
  # Manuali dell'assemblea: siti a parte (docs-manuali/), generati da
  # .readthedocs.yaml nella sottocartella assemblea/ dello stesso sito.
  - Assemblea di Zona:
      - Manuale di gestione dell'assemblea: assemblea/gestione/
      - Manuale per il banco e i seggi: assemblea/banco/
      - Manuale di voto in app: assemblea/voto-app/
      - Manuale di voto al seggio: assemblea/voto-seggio/

plugins:
  - search
  - with-pdf:
      output_path: pdf/guida-capigruppo.pdf
      cover_title: Guida per i Capigruppo
      cover_subtitle: Segreteria AGESCI Hirpinia
      # Logo ufficiale della Zona, lo stesso della carta intestata dei PDF.
      cover_logo: static/pdf/img/logo_zona.png
      author: AGESCI Zona Hirpinia
      toc_title: Indice
      custom_template_path: docs-manuali/pdf

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
