# Manuale di voto al seggio (docs/plan_preparazione_assemblea.md, R11). Le pagine stanno in
# docs-manuali/voto/, condivise con gli altri manuali di voto: ciascun manuale ne
# sceglie alcune con il nav. Si rigenera solo se cambiano le pagine descritte:
# vedi docs-manuali/README.md.
site_name: Segreteria AGESCI Hirpinia — Manuale di voto al seggio
site_description: >-
  Come si vota a un seggio in sala nelle elezioni dell'Assemblea di Zona.
site_author: AGESCI Zona Hirpinia
docs_dir: docs-manuali/voto
site_dir: site-voto-seggio

theme:
  name: material
  language: it
  palette:
    primary: green
    accent: light green
  features:
    - navigation.sections

nav:
  - Introduzione: index-seggio.md
  - Il codice di voto: codice.md
  - Entrare al seggio: seggio.md
  - Compilare la scheda: scheda.md
  - Controllare il proprio voto: verifica.md
  - Se qualcosa non va: problemi.md

plugins:
  - search
  - with-pdf:
      output_path: pdf/manuale-voto-seggio.pdf
      cover_title: Manuale di voto al seggio
      cover_subtitle: Segreteria AGESCI Hirpinia
      # Logo ufficiale della Zona, lo stesso della carta intestata dei PDF.
      cover_logo: static/pdf/img/logo_zona.png
      author: AGESCI Zona Hirpinia
      copyright: AGESCI Zona Hirpinia
      toc_title: Indice
      custom_template_path: docs-manuali/pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
