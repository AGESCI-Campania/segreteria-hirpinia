{% extends "base.html" %}

{% block page_title %}Nuova delega{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="md:col-6">
      <h1>Concedi una delega</h1>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-field mb-5">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
        <button type="submit" class="btn-solid theme-primary">Crea delega</button>
      </form>
    </div>
  </div>
{% endblock %}
