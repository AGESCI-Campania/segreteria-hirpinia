{% extends "base.html" %}

{% block page_title %}Invia invito di attivazione{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1>Invia un invito di attivazione</h1>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Invia invito</button>
      </form>
    </div>
  </div>
{% endblock %}
