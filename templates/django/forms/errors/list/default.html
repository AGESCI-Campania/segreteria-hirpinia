{% if errors %}{% if "nonfield" in error_class %}<div class="alert alert-danger"{% if errors.field_id %} id="{{ errors.field_id }}_error"{% endif %}>{% for error in errors %}<div>{{ error }}</div>{% endfor %}</div>{% else %}<div class="invalid-feedback"{% if errors.field_id %} id="{{ errors.field_id }}_error"{% endif %}>{% for error in errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>{% endif %}{% endif %}
