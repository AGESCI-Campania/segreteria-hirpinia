<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 2cm; }
  body { font-family: sans-serif; font-size: 10.5pt; color: #222; }
  h1 {
    font-size: 11pt;
    background: #f0f0f5;
    border: 1px solid #999;
    padding: 0.2cm 0.4cm;
    margin: 0 0 0.6cm 0;
  }
  .immagine {
    display: block;
    max-width: 100%;
    max-height: 24cm;
    margin: 0 auto;
  }
  .senza-immagine { color: #777; font-style: italic; }
</style>
</head>
<body>
  <h1>
    Giustificativo — Riga {{ numero_riga }}: {{ riga.data|date:"d/m/Y" }} — {{ riga.categoria.nome }}
  </h1>
  {% if immagine_base64 %}
    <img class="immagine" src="data:image/jpeg;base64,{{ immagine_base64 }}" alt="Giustificativo">
  {% else %}
    <p class="senza-immagine">Il documento originale segue in coda a questa pagina.</p>
  {% endif %}
</body>
</html>
