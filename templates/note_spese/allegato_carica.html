{% extends "base.html" %}

{% block page_title %}Carica giustificativo{% endblock %}

{% block content %}
  <h1>Carica giustificativo</h1>
  <p class="text-muted">Riga: {{ riga.categoria }} — {{ riga.data }}</p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="file">File (PDF, JPEG, PNG o HEIC, max 10 MB)</label>
      <input type="file" name="file" id="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.heic" required>
    </div>
    <button type="submit" class="btn btn-primary">Carica</button>
    <a href="{% url 'note_spese:nota_dettaglio' nota.pk %}" class="btn btn-outline-secondary">Annulla</a>
  </form>
{% endblock %}
