<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Codice di voto</title>
<style>
  @page { size: 50mm 80mm; margin: 1mm; }
  body { margin: 0; font-family: "DejaVu Sans", Verdana, sans-serif; color: #000; text-align: center; }
  .piccolo { font-size: 6.5pt; line-height: 1.2; margin: 1mm 0 0 0; }
  .nome { font-size: 9pt; font-weight: bold; margin: 1.5mm 0 1mm 0; }
  .qr { display: block; width: 42mm; height: 42mm; margin: 0 auto; }
  .codice { font-size: 12.5pt; font-weight: bold; margin: 1.5mm 0 0 0; white-space: nowrap; }
</style>
</head>
<body>
  <p class="piccolo">{{ etichetta.assemblea }}<br>{{ etichetta.convocazione }}</p>
  <p class="nome">{{ etichetta.nome }}</p>
  <img class="qr" src="{{ qr }}" alt="">
  <p class="codice">{{ etichetta.codice }}</p>
</body>
</html>
