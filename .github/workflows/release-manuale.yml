name: allega-manuale-release

on:
  release:
    types: [published]

jobs:
  allega-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installa Python
        run: uv python install 3.14

      - name: Installa le dipendenze di sistema di WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Installa le dipendenze della documentazione
        run: uv sync --group docs --no-install-project

      - name: Genera il manuale (MkDocs + PDF)
        run: uv run mkdocs build

      - name: Allega il PDF alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" site/pdf/guida-capigruppo.pdf --clobber
