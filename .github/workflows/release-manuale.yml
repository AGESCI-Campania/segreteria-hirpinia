name: allega-manuale-release

on:
  release:
    types: [published]

jobs:
  allega-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia con i tag per confrontare con la release precedente.
          fetch-depth: 0

      # Solo i manuali cambiati dalla release precedente (testi, pagine
      # descritte, configurazione, stile dei PDF): docs-manuali/manuali_cambiati.py.
      # Il link sempre aggiornato resta quello di Read the Docs (stable).
      - name: Manuali cambiati
        id: cambiati
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          precedente=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          echo "Release precedente: ${precedente:-nessuna}"
          python3 docs-manuali/manuali_cambiati.py "$precedente" "$TAG" > manuali.txt
          cat manuali.txt
          if [ -s manuali.txt ]; then echo "da_generare=true" >> "$GITHUB_OUTPUT"; fi

      - name: Installa uv
        if: steps.cambiati.outputs.da_generare
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Installa Python
        if: steps.cambiati.outputs.da_generare
        run: uv python install 3.14

      - name: Installa le dipendenze di sistema di WeasyPrint
        if: steps.cambiati.outputs.da_generare
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Installa le dipendenze della documentazione
        if: steps.cambiati.outputs.da_generare
        run: uv sync --group docs --no-install-project

      - name: Genera i manuali cambiati (MkDocs + PDF)
        if: steps.cambiati.outputs.da_generare
        run: |
          while read -r configurazione; do
            uv run mkdocs build -f "$configurazione" < /dev/null
          done < manuali.txt

      - name: Allega i PDF alla release
        if: steps.cambiati.outputs.da_generare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pdf=()
          while read -r configurazione; do
            cartella=$(grep -m1 '^site_dir:' "$configurazione" | awk '{print $2}')
            uscita=$(grep -m1 'output_path:' "$configurazione" | awk '{print $2}')
            pdf+=("$cartella/$uscita")
          done < manuali.txt
          gh release upload "$TAG" "${pdf[@]}" --clobber
