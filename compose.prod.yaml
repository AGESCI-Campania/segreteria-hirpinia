# Produzione: tutto in Docker tranne il reverse proxy.
# Generato/adattato da ./configure-prod.sh
services:
  db:
    image: postgres:17-alpine
    container_name: catello_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opzionale: attivo solo con `docker compose -f compose.prod.yaml up -d
  # mailpit` (o `--profile mailpit up -d`), mai da un `up -d` senza
  # argomenti — chi non usa l'interruttore "Invia le email su Mailpit" in
  # Impostazioni non deve far girare un container in più. Interfaccia web
  # solo su loopback, come "web" sotto: mai esposta pubblicamente. Con
  # questo servizio attivo, impostare EMAIL_MAILPIT_HOST=mailpit in .env
  # (il nome del servizio, risolto sulla rete Docker interna).
  mailpit:
    image: axllent/mailpit:latest
    container_name: catello_mailpit
    restart: unless-stopped
    profiles: ["mailpit"]
    ports:
      - "127.0.0.1:8025:8025"

  web:
    image: catello-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Vuoto di default: chi usa solo smtp/console/locmem non installa
        # google-auth/msal. Impostare EMAIL_EXTRA=gmail o =microsoft in .env
        # in base a EMAIL_PROVIDER.
        EMAIL_EXTRA: ${EMAIL_EXTRA:-}
    container_name: catello_web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - /srv/segreteriahirpinia/static:/app/staticfiles
      - /srv/segreteriahirpinia/media:/app/media
      - /srv/segreteriahirpinia/log:/app/log

  # Pulizia periodica delle sessioni scadute (issue #12): Django non lo fa da
  # solo, `manage.py clearsessions` va eseguito periodicamente. Non opzionale
  # come Mailpit sopra (nessun `profiles:`): riusa l'immagine già buildata da
  # "web" (nessun build/Dockerfile proprio), con entrypoint/command
  # sovrascritti per non eseguire la sequenza fissa di docker/entrypoint.sh
  # (migrate/collectstatic/gunicorn, pensata solo per "web").
  pulizia-sessioni:
    image: catello-web:latest
    container_name: catello_pulizia_sessioni
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          uv run --no-sync python manage.py clearsessions
          sleep 86400
        done

  # Promemoria giornaliero/settimanale al capo (D-63, F7): stesso pattern di
  # pulizia-sessioni sopra, deciso con Andrea il 2026-09-24 al posto di
  # Celery/Redis (D-17 resta valido così com'è). Il comando stesso decide
  # se oggi è un giorno di promemoria (note_spese/promemoria.py), qui gira
  # una volta al giorno e basta.
  note-spese-promemoria:
    image: catello-web:latest
    container_name: catello_note_spese_promemoria
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          uv run --no-sync python manage.py note_spese_promemoria
          sleep 86400
        done

volumes:
  postgres_data:
