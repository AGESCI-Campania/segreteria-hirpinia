[tools]
python = "3.14"
uv = "latest"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"

[tasks.dev]
description = "Avvia il server di sviluppo"
run = "uv run python manage.py runserver"

[tasks.migrate]
description = "Applica le migrazioni"
run = "uv run python manage.py migrate"

[tasks.makemigrations]
description = "Genera le migrazioni"
run = "uv run python manage.py makemigrations"

[tasks.shell]
description = "Shell Django"
run = "uv run python manage.py shell"

[tasks.test]
description = "Esegue la suite di test"
run = "uv run pytest"

[tasks.lint]
description = "Controlli di qualita del codice"
run = [
    "uv run ruff check .",
    "uv run black --check .",
    "uv run mypy apps config",
]

[tasks.format]
description = "Formatta il codice"
run = [
    "uv run ruff check --fix .",
    "uv run black .",
]

[tasks.db-up]
description = "Avvia PostgreSQL in Docker per lo sviluppo"
run = "docker compose up -d db"

[tasks.db-down]
description = "Ferma PostgreSQL"
run = "docker compose down"

[tasks.mailpit-up]
description = "Avvia Mailpit in Docker (cattura le email inviate con EMAIL_PROVIDER=smtp in sviluppo)"
run = "docker compose up -d mailpit"

[tasks.mailpit-down]
description = "Ferma Mailpit"
run = "docker compose stop mailpit"

[tasks.docs-serve]
description = "Anteprima locale della documentazione utente (MkDocs)"
run = "uv run --group docs mkdocs serve"

[tasks.docs-build]
description = "Genera la documentazione utente (HTML + PDF) in site/"
run = "uv run --group docs mkdocs build"
