{% comment %}
`widget` qui è il dict della singola opzione (passato con `with widget=option`
dal template padre), non il widget nel suo insieme — stessa convenzione dei
template widget di Django (vedi django/forms/widgets/input_option.html).
{% endcomment %}
<div class="form-check">
  <input type="checkbox"
         class="form-check-input ag-multiselect__checkbox"
         name="{{ widget.name }}"
         value="{{ widget.value|stringformat:'s' }}"
         id="{{ widget.attrs.id }}"
         {% if widget.attrs.checked %}checked{% endif %}>
  <label class="form-check-label" for="{{ widget.attrs.id }}">{{ widget.label }}</label>
</div>
