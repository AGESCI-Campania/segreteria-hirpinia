version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    # Richieste da WeasyPrint (mkdocs-with-pdf), stesso elenco di docker/Dockerfile.
    - libpango-1.0-0
    - libpangoft2-1.0-0
    - libcairo2
    - libgdk-pixbuf-2.0-0
    - shared-mime-info
  jobs:
    install:
      - pip install uv
      # UV_PROJECT_ENVIRONMENT: senza questa variabile `uv sync` installa nel
      # proprio .venv locale al progetto, non nel virtualenv che Read the Docs
      # usa poi per eseguire `mkdocs build` (`$READTHEDOCS_VIRTUALENV_PATH`) —
      # con `mkdocs` installato altrove, quel comando fallisce con
      # "No module named mkdocs".
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs --no-install-project
    # Manuali dell'assemblea (docs-manuali/), con i loro PDF, nella
    # sottocartella assemblea/ dello stesso sito: la guida li collega dal menu
    # e le email di nomina puntano alla versione stable (ultima release).
    post_build:
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m mkdocs build -f mkdocs-gestione.yml --site-dir $READTHEDOCS_OUTPUT/html/assemblea/gestione
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m mkdocs build -f mkdocs-banco.yml --site-dir $READTHEDOCS_OUTPUT/html/assemblea/banco
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m mkdocs build -f mkdocs-voto-app.yml --site-dir $READTHEDOCS_OUTPUT/html/assemblea/voto-app
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m mkdocs build -f mkdocs-voto-seggio.yml --site-dir $READTHEDOCS_OUTPUT/html/assemblea/voto-seggio
      # Rimandi assemblea/<manuale>/ per i tre manuali di voto (vedi lo script).
      - sh docs-manuali/rimandi_rtd.sh $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
