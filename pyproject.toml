[project]
name = "catello-hirpinia"
version = "0.1.0"
description = "Piattaforma di segreteria della AGESCI Zona Hirpinia"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrea Bruno" }]
maintainers = [{ name = "Andrea Bruno" }]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-agesci-campania-theme>=1.2.4",
    "django-allauth[mfa]>=65.0",
    "django-auditlog>=3.0",
    "django-axes>=8.3",
    "django-fsm-2>=4.0",
    "django-hijack>=3.7",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2",
    "openpyxl>=3.1",
    "weasyprint>=68",
    "gunicorn>=26.0",
]

[project.optional-dependencies]
# Installare solo il provider email effettivamente usato:
#   uv sync --extra gmail        oppure     uv sync --extra microsoft
gmail = [
    "google-auth>=2.38",
    "requests>=2.32",
]
microsoft = [
    "msal>=1.31",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "black>=25.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "django-debug-toolbar>=6.0",
    "selenium>=4.47.0",
]

[project.urls]
Homepage = "https://github.com/AGESCI-Campania/catello-hirpinia"
Repository = "https://github.com/AGESCI-Campania/catello-hirpinia"
Author = "https://bruand81.it"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.black]
line-length = 100
target-version = ["py314"]
# Parser portato e validato (D-07): nessuna modifica, nemmeno di formattazione.
# Vedi CLAUDE.md § Parsing PDF.
extend-exclude = "apps/anagrafica/parser/autorizzazioni.py"

[tool.ruff]
line-length = 100
target-version = "py314"
# Stessa esclusione di black, stesso motivo.
extend-exclude = ["apps/anagrafica/parser/autorizzazioni.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps"]
python_files = ["test_*.py", "tests.py"]
